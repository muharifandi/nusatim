# Optimization for 100% Build Scalability Score
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Offline Build & Performance Enhancements
# Mengaktifkan daemon untuk mempercepat build berulang
org.gradle.daemon=true
# Mengizinkan Gradle menggunakan lebih banyak memori jika tersedia
org.gradle.workers.max=4

# Android Specific
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
ksp.incremental=true
# Mengaktifkan R8/Proguard caching untuk offline build
android.enableR8.fullMode=true

# Support for 16 KB page size alignment
# Note: android.bundle.enableUncompressedNativeLibs is removed in AGP 8.1
# Native libs are now uncompressed by default when minSdk >= 23

# Disable Hilt aggregating processor warning
kapt.use.aggregating.root.processor=false

# Support for Android 16 (SDK 36) with AGP 8.7.0
android.suppressUnsupportedCompileSdk=36
